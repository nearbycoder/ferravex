[workspace]
resolver = "2"
members = [
    "crates/ferravex",
    "crates/ferravex-bench",
    "crates/ferravex-core",
    "crates/ferravex-dynamics",
    "crates/ferravex-ecs",
    "crates/ferravex-engine",
    "crates/ferravex-fps",
    "crates/ferravex-graphics",
    "crates/ferravex-math",
    "crates/ferravex-net",
    "crates/ferravex-physics",
    "crates/ferravex-play",
    "crates/ferravex-render",
    "examples/crystal-cavern",
    "examples/dune-skimmer",
    "examples/emberline",
    "examples/marble-run",
    "examples/neon-swarm",
    "examples/orchard-guard",
    "examples/owned-lab",
    "examples/owned-orbit",
    "examples/physics-2d",
    "examples/physics-3d",
    "examples/pocket-rally",
    "examples/salvage-pinball",
    "examples/siege-foundry",
    "examples/sky-courier",
    "examples/strike",
]
default-members = ["examples/owned-lab"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
ferravex-render = { path = "crates/ferravex-render" }
ferravex-physics = { path = "crates/ferravex-physics" }
ferravex-graphics = { path = "crates/ferravex-graphics" }
ferravex-play = { path = "crates/ferravex-play" }
ferravex-engine = { path = "crates/ferravex-engine" }
ferravex-math = { path = "crates/ferravex-math" }
ferravex-ecs = { path = "crates/ferravex-ecs" }
ferravex-dynamics = { path = "crates/ferravex-dynamics" }
ferravex-core = { path = "crates/ferravex-core" }
ferravex = { path = "crates/ferravex", default-features = false }
ferravex-net = { path = "crates/ferravex-net" }
ferravex-fps = { path = "crates/ferravex-fps" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Opt in when download size matters more than maximum simulation throughput.
[profile.small]
inherits = "release"
opt-level = "z"
lto = "fat"

[package]
name = "ferravex-physics"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Optional 2D and 3D Rapier physics for Ferravex"

[features]
default = ["dim2", "dim3"]
dim2 = ["dep:rapier2d"]
dim3 = ["dep:rapier3d"]
# Opt in for reproducibility across supported CPU targets. This is not a
# substitute for authoritative server simulation or a fixed timestep.
deterministic = ["rapier2d?/enhanced-determinism", "rapier3d?/enhanced-determinism"]

[dependencies]
rapier2d = { version = "=0.36.1", optional = true }
rapier3d = { version = "=0.36.1", optional = true }

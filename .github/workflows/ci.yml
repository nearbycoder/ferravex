name: Rust and platform checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_NET_OFFLINE: "true"
  CARGO_BUILD_JOBS: "2"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  changed-plan:
    name: Advisory changed-path validation plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Plan affected groups without executing checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Keep both rename sides and deletions. This plan does not gate or trim
        # the authoritative full jobs below; redirects are CI-owned artifacts.
        run: |
          mkdir -p target/validation
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" -- > target/validation/changed-paths.z
          python3 -B scripts/validate.py --mode changed --changed-paths-file target/validation/changed-paths.z --dry-run --json > target/validation/changed-plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-changed-plan
          path: target/validation
          if-no-files-found: warn

  native:
    name: Native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux graphics libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl1-mesa-dev libasound2-dev xvfb
      - name: Rust, dependency boundary, catalog and developer-tool regressions
        run: python3 -B scripts/validate.py --mode full --group rust --group python --require-complete --report target/validation/native.json
      - name: Headless, rendered gameplay and GPU pixel regressions
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x1024x24" python3 -B scripts/validate.py --mode full --group native --require-complete --report target/validation/graphics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: target/validation
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: native-gameplay-captures
          path: |
            target/game-smoke
            target/game-smoke-headless
          if-no-files-found: warn

  web:
    name: WebAssembly / all examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser hosts, actual Wasm, native authority, tooling and documentation
        run: python3 -B scripts/validate.py --mode full --group js --group wasm --group python --group site --require-complete --report target/validation/web.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-web
          path: target/validation
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ferravex-web
          path: dist/site
          if-no-files-found: error

  ios:
    name: iOS compile check / ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check against the Apple SDK (no signing or simulator execution)
        run: cargo check --workspace --all-features --offline --locked --jobs 2 --target ${{ matrix.target }}

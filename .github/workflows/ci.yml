name: Rust and platform checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: Native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux graphics libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl1-mesa-dev libasound2-dev xvfb
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Check workspace targets
        run: cargo check --workspace --all-targets --all-features --offline --locked
      - name: First-party dependency boundary
        run: python3 scripts/audit-owned.py
      - name: Unit, physics, gameplay, and loopback UDP tests
        run: cargo test --workspace --all-features --offline --locked
      - name: Browser input regression
        if: runner.os == 'Linux'
        run: node examples/owned-orbit/tests/platform-input.mjs
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --all-features --offline --locked -- -D warnings
      - name: Rendered gameplay smoke tests
        if: runner.os == 'Linux'
        run: |
          cargo build --release --workspace --bins --all-features --offline --locked
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x1024x24" python3 scripts/smoke-games.py --frames 180 --output target/game-smoke
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: native-gameplay-captures
          path: target/game-smoke
          if-no-files-found: warn

  web:
    name: WebAssembly / all examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and stage the first-party browser hosts
        run: |
          sh scripts/build-web.sh release
      - name: Browser host and actual-Wasm regressions
        run: |
          for suite in web/tests/*.mjs; do node "$suite" || exit; done
          node crates/ferravex-render/tests/browser-input.mjs
          node examples/owned-orbit/tests/platform-input.mjs
      - name: Native authority and browser WebSocket integration
        run: |
          cargo build --release -p ferravex-fps --bin ferravex-server --offline --locked
          node web/tests/multiplayer.mjs --native
      - name: Report exact artifact sizes
        run: python3 scripts/report-size.py --profile release
      - name: Documentation site and HTTP regressions
        run: |
          cargo doc --workspace --no-deps --all-features --offline --locked
          python3 scripts/build-site.py --skip-build
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: ferravex-web
          path: dist/site
          if-no-files-found: error

  ios:
    name: iOS compile check / ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check against the Apple SDK (no signing or simulator execution)
        run: cargo check --workspace --all-features --offline --locked --target ${{ matrix.target }}
